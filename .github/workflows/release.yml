name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare folders
        run: mkdir -p build/reports/trivy

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: true
          format: "sarif"
          output: "build/reports/trivy/trivy-results.sarif"
          severity: "CRITICAL"
          # skip-setup-trivy: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "zulu"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve Mifos Build Configuration
        run: ./gradlew mifosConfigUnzip

      - name: Build with Gradle
        run: ./gradlew clean build publish

      - name: Run JReleaser
        uses: jreleaser/jreleaser-action@v2
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_ARTIFACTORY_TOKEN: ${{ secrets.JRELEASER_ARTIFACTORY_TOKEN }}
          JRELEASER_ARTIFACTORY_USERNAME: ${{ secrets.JRELEASER_ARTIFACTORY_USERNAME }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
